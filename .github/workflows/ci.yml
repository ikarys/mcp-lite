name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Secrets
        env:
          GITLEAKS: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS"
          curl -sSfLO "$base/gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${GITLEAKS}_checksums.txt" | grep linux_x64 | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS}_linux_x64.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .
      - name: Lint
        run: just lint
      - name: Tests
        run: just test
      - name: Docs
        run: just doc
      - name: Advisories
        run: cargo audit

